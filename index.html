<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LoL パッチウォッチ</title><style>
:root{font-family:system-ui,'Segoe UI',sans-serif;color:#e8edf5;background:#09121f}*{box-sizing:border-box}body{margin:0}header{padding:30px max(20px,calc((100vw - 1000px)/2));background:linear-gradient(120deg,#142d46,#09121f);border-bottom:1px solid #29445b}h1{margin:0;color:#e9c77b;font-size:30px}header p{color:#9caec3}main{max-width:1000px;margin:25px auto;padding:0 18px}.panel{background:#111f30;border:1px solid #2c4057;border-radius:15px;padding:20px;margin-bottom:18px}input,select,button{font:inherit;border-radius:9px;padding:12px;background:#0b1725;color:#f2f4f9;border:1px solid #456078}input{width:100%}button{cursor:pointer;background:#24445a}button:hover{background:#32627c}.controls{display:grid;grid-template-columns:1fr 190px;gap:12px}.small{color:#aabbd0;font-size:13px}.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tag{border:1px solid #9d7a36;color:#f4d994;padding:7px 10px;border-radius:20px;background:#2c281c;cursor:pointer}.tag button{border:0;padding:0 0 0 7px;background:transparent;color:inherit}.entry{border-top:1px solid #304256;padding:18px 0}.entry:first-child{border-top:0}.entry h3{margin:5px 0}.entry a{color:#9ed8ff}.date{color:#a3b4c5;font-size:13px}.changes{line-height:1.65;white-space:pre-wrap;background:#0a1725;border-left:3px solid #b89957;padding:12px;margin-top:10px}.empty{padding:30px;text-align:center;color:#9db0c3}.status{color:#b4c3d3}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.count{color:#e9c77b}label{display:block;margin-bottom:8px;color:#becbdb}#suggestions{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}.suggest{padding:6px 10px;font-size:13px}@media(max-width:600px){.controls{grid-template-columns:1fr}h1{font-size:24px}}
</style></head><body><header><h1>⚔ LoL パッチウォッチ</h1><p>好きなチャンピオンの調整だけを、公式パッチノートから。</p></header><main><section class="panel"><label for="search">チャンピオンを追加（日本語・英語）</label><div class="controls"><input id="search" placeholder="例：アーリ / Ahri" autocomplete="off"><select id="period"><option value="all">すべての履歴</option><option value="5">直近5パッチ</option><option value="10">直近10パッチ</option><option value="20">直近20パッチ</option></select></div><div id="suggestions"></div><div class="tags" id="tags"></div><p class="small">選択したチャンピオンはこのブラウザに保存されます。サモナーズリフトの「チャンピオン」セクションを対象に抽出します。</p></section><section class="panel"><div class="row"><strong>調整履歴 <span class="count" id="count"></span></strong><button id="reload">データを再読込</button></div><p class="status" id="status">読み込み中...</p><div id="results"></div></section><p class="small">出典：Riot Games公式日本語パッチノート。自動分類ではなく、公式本文をそのまま抜粋します。誤抽出・掲載漏れがないか公式リンクでも確認してください。</p></main><script>
const $=id=>document.getElementById(id);let champions=[],patches=[],selected=JSON.parse(localStorage.getItem('lol-selected')||'[]');const norm=s=>(s||'').normalize('NFKC').toLowerCase().replace(/[\s・'’=＝-]/g,'');function save(){localStorage.setItem('lol-selected',JSON.stringify(selected))}function add(id){if(!selected.includes(id))selected.push(id);save();$('search').value='';render()}function remove(id){selected=selected.filter(x=>x!==id);save();render()}function render(){const q=norm($('search').value);$('suggestions').replaceChildren();if(q){champions.filter(c=>norm(c.name).includes(q)||norm(c.en).includes(q)).slice(0,12).forEach(c=>{let b=document.createElement('button');b.className='suggest';b.textContent=c.name+' ('+c.en+')';b.onclick=()=>add(c.id);$('suggestions').append(b)})} $('tags').replaceChildren();selected.forEach(id=>{let c=champions.find(x=>x.id===id),tag=document.createElement('span');tag.className='tag';tag.textContent=c?.name||id;let b=document.createElement('button');b.textContent='×';b.setAttribute('aria-label','削除');b.onclick=()=>remove(id);tag.append(b);$('tags').append(tag)});let visible=[...patches].sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.version.localeCompare(a.version,undefined,{numeric:true})).slice(0,$('period').value==='all'?undefined:Number($('period').value));let entries=visible.flatMap(p=>(p.changes||[]).filter(c=>selected.includes(c.champion_id)).map(c=>({...c,patch:p})));$('count').textContent=entries.length+'件';$('results').replaceChildren();if(!selected.length){$('results').innerHTML='<div class="empty">上からチャンピオンを選んでね。</div>';return}if(!entries.length){$('results').innerHTML='<div class="empty">選択した範囲に調整履歴は見つかりませんでした。</div>';return}entries.forEach(e=>{let el=document.createElement('article');el.className='entry';let date=document.createElement('div');date.className='date';date.textContent=(e.patch.date?'公開日 '+e.patch.date:'公開日不明')+' · Patch '+e.patch.version;let h=document.createElement('h3');h.textContent=e.champion;let body=document.createElement('div');body.className='changes';body.textContent=e.text;let a=document.createElement('a');a.href=e.patch.url;a.target='_blank';a.rel='noopener';a.textContent='公式パッチノートを見る ↗';el.append(date,h,body,a);$('results').append(el)})}
async function load(){try{$('status').textContent='データを読み込み中...';const [a,b]=await Promise.all([fetch('champions.json?'+Date.now()),fetch('patches.json?'+Date.now())]);if(!a.ok||!b.ok)throw Error('JSONを取得できません');champions=await a.json();patches=await b.json();$('status').textContent=`${patches.length}パッチを収録 · 最新 ${patches[0]?.version||'なし'}`;render()}catch(e){$('status').textContent='読み込み失敗：'+e.message+'。READMEの起動方法を確認してください。'}}$('search').addEventListener('input',render);$('search').addEventListener('keydown',e=>{if(e.key==='Enter'){let q=norm(e.target.value),c=champions.find(c=>norm(c.name)===q||norm(c.en)===q);if(c)add(c.id)}});$('period').onchange=render;$('reload').onclick=load;load();
</script></body></html>
